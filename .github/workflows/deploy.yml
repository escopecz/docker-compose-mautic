name: Mautic deployment (manual only)
on:
  workflow_dispatch:
    inputs:
      instance:
        description: Target instance
        type: choice
        options: [cronfig, chimpino, legacy-veetr]
        default: cronfig
      cronfig_action:
        description: Selected instance deployment phase
        type: choice
        options: [stage, activate, verify, maintenance, renew-certificate]
        default: stage
      release:
        description: Private payload ID already staged directly on DigitalOcean
        type: string
        default: 20261023-m7
      recovery_run:
        description: Existing backup run ID to reuse for rehearsal (optional)
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: mautic-veetr-v2-upgrade
  cancel-in-progress: false
jobs:
  upgrade:
    if: github.ref == 'refs/heads/veetr-v2' && inputs.instance == 'legacy-veetr'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      TARGET_IMAGE: mautic/mautic@sha256:2d249853dc475ce0b0c2415d09dc43657496047c21b5bfb0a383415673ebf54b
      MYSQL_IMAGE: mysql@sha256:76f0358884cb92d9a086d24e5671c38048d3fef40f2588703d73eb55392d6b69
      DEPLOY_HOST: 165.232.83.73
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: chimpino/stripe-plugin
          ref: 4409862be94cc13c55dd2da889d9948a93943fcc
          token: ${{ secrets.CHIMPINO_GITHUB_TOKEN }}
          persist-credentials: false
          path: stripe-plugin
      - name: Configure scoped SSH connections
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          ssh-keygen -y -f ~/.ssh/id_ed25519 > "$RUNNER_TEMP/deploy.pub"
          ssh-keygen -q -t ed25519 -N '' -f "$RUNNER_TEMP/transfer"
          ssh-keygen -q -t ed25519 -N '' -f "$RUNNER_TEMP/test-host"
          echo '165.232.83.73 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIGaRm7II3PTOL5ncrjYgZ6ZhRvuJ6lolt/CwXX/bRbQh' > ~/.ssh/known_hosts
          printf 'Host *\n  User root\n  IdentityFile ~/.ssh/id_ed25519\n  IdentitiesOnly yes\n  StrictHostKeyChecking yes\n  ConnectTimeout 10\n  BatchMode yes\n  ServerAliveInterval 15\n  ServerAliveCountMax 3\n' > ~/.ssh/config
          ssh "$DEPLOY_HOST" 'test "$(hostname)" = mautic-veetr-v2'
      - name: Create isolated temporary DigitalOcean test server
        env:
          DIGITALOCEAN_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
        run: python3 scripts/test-droplet.py create
      - name: Wait for temporary test server
        run: |
          printf '%s %s\n' "$TEST_HOST" "$(cat "$RUNNER_TEMP/test-host.pub")" >> ~/.ssh/known_hosts
          ready=false
          for attempt in $(seq 1 60); do
            if ssh -o ConnectTimeout=3 "$TEST_HOST" test -f /root/rehearsal-ready 2> "$RUNNER_TEMP/ssh-ready.log"; then ready=true; break; fi
            sleep 5
          done
          if ! "$ready"; then
            cat "$RUNNER_TEMP/ssh-ready.log"
            ssh -o ConnectTimeout=3 "$TEST_HOST" 'cloud-init status --long' || true
            exit 1
          fi
          ssh "$TEST_HOST" 'umask 077; mkdir -p /root/recovery /root/scripts /root/plugin'
      - name: Prepare verified recovery backup
        env:
          RECOVERY_RUN: ${{ inputs.recovery_run }}
        run: |
          backup_run=${RECOVERY_RUN:-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT}
          [[ "$backup_run" =~ ^[0-9]+-[0-9]+$ ]]
          echo "BACKUP_RUN=$backup_run" >> "$GITHUB_ENV"
          if [[ -z "$RECOVERY_RUN" ]]; then
            ssh "$DEPLOY_HOST" bash -s -- "$backup_run" < scripts/backup.sh
          else
            ssh "$DEPLOY_HOST" "cd '/root/mautic-upgrade-$backup_run' && sha256sum -c SHA256SUMS"
          fi
      - name: Transfer backup directly between DigitalOcean droplets
        run: |
          backup="/root/mautic-upgrade-$BACKUP_RUN"
          printf '%s %s\n' "$TEST_HOST" "$(cat "$RUNNER_TEMP/test-host.pub")" > "$RUNNER_TEMP/test-known-hosts"
          scp "$RUNNER_TEMP/transfer" "$RUNNER_TEMP/test-known-hosts" "$DEPLOY_HOST:$backup/"
          ssh "$DEPLOY_HOST" "chmod 600 '$backup/transfer'; scp -q -i '$backup/transfer' -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile='$backup/test-known-hosts' '$backup/app.tar.gz' '$backup/db.sql.gz' '$backup/.mautic_env' '$backup/runtime-image' '$backup/SHA256SUMS' 'root@$TEST_HOST:/root/recovery/'"
          ssh "$TEST_HOST" 'cd /root/recovery && sha256sum -c SHA256SUMS'
          scp scripts/rehearse.sh scripts/preserve-custom.py "$TEST_HOST:/root/scripts/"
          tar --exclude=.git -czf "$RUNNER_TEMP/plugin.tar.gz" -C stripe-plugin .
          scp "$RUNNER_TEMP/plugin.tar.gz" "$TEST_HOST:/root/plugin.tar.gz"
          ssh "$TEST_HOST" 'tar -xzf /root/plugin.tar.gz -C /root/plugin'
      - name: Rehearse restore and migration with outbound integrations blocked
        run: |
          # Detailed diagnostics remain on DigitalOcean, never in public Actions logs.
          if ! ssh "$TEST_HOST" "cd /root; RUNNER_TEMP=/root GITHUB_STEP_SUMMARY=/root/summary TARGET_IMAGE='$TARGET_IMAGE' MYSQL_IMAGE='$MYSQL_IMAGE' bash scripts/rehearse.sh > /root/recovery/rehearsal.log 2>&1"; then
            backup="/root/mautic-upgrade-$BACKUP_RUN"
            ssh "$DEPLOY_HOST" "scp -q -i '$backup/transfer' -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile='$backup/test-known-hosts' 'root@$TEST_HOST:/root/recovery/rehearsal.log' '$backup/rehearsal.log'"
            echo 'Rehearsal failed; private diagnostics are in the root-only production backup directory.'
            exit 1
          fi
          echo 'Backup restore and Mautic 7 migration rehearsal passed.' >> "$GITHUB_STEP_SUMMARY"
      - name: Stage tested application directly on production
        run: |
          stage="/root/mautic-stage-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          backup="/root/mautic-upgrade-$BACKUP_RUN"
          ssh "$TEST_HOST" bash -s < scripts/export-code.sh
          ssh "$DEPLOY_HOST" "umask 077; mkdir -p '$stage'"
          scp scripts/backup.sh scripts/upgrade.sh scripts/compose-upgrade.py scripts/preserve-custom.py "$DEPLOY_HOST:$stage/"
          ssh "$DEPLOY_HOST" "scp -q -i '$backup/transfer' -o BatchMode=yes -o ConnectTimeout=10 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile='$backup/test-known-hosts' 'root@$TEST_HOST:/root/code.tar.gz' 'root@$TEST_HOST:/root/CODE_SHA256SUMS' '$stage/' && mv '$stage/CODE_SHA256SUMS' '$stage/SHA256SUMS'"
      - name: Upgrade production with fresh backup and automatic pre-traffic rollback
        run: |
          stage="/root/mautic-stage-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          if ! ssh "$DEPLOY_HOST" "TARGET_IMAGE='$TARGET_IMAGE' MYSQL_IMAGE='$MYSQL_IMAGE' bash '$stage/upgrade.sh' '$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT' > '$stage/upgrade.log' 2>&1"; then
            echo 'Production upgrade did not complete; root-only diagnostics are in the production stage directory.'
            exit 1
          fi
          echo 'Production upgrade and internal health checks completed.' >> "$GITHUB_STEP_SUMMARY"
      - name: Verify public Mautic HTTPS login page
        run: |
          curl --fail --silent --show-error --max-time 30 --retry 4 --retry-delay 5 --output "$RUNNER_TEMP/login.html" https://m.veetr.com/s/login
          grep -q 'name="_username"' "$RUNNER_TEMP/login.html"
      - name: Remove temporary transfer key from production
        if: always()
        run: |
          [[ -n "${BACKUP_RUN:-}" ]] || exit 0
          ssh "$DEPLOY_HOST" "test ! -f '/root/mautic-upgrade-$BACKUP_RUN/transfer' || shred -u '/root/mautic-upgrade-$BACKUP_RUN/transfer'"
      - name: Delete temporary DigitalOcean test server
        if: always()
        env:
          DIGITALOCEAN_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
        run: python3 scripts/test-droplet.py delete

  cronfig:
    if: github.ref == 'refs/heads/veetr-v2' && inputs.instance == 'cronfig'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DEPLOY_HOST: 165.232.83.73
      RELEASE: ${{ inputs.release }}
      ACTION: ${{ inputs.cronfig_action }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Validate deployment code
        run: |
          python3 -m unittest discover -s tests
          python3 -m py_compile scripts/cronfig-deploy.py scripts/cronfig-compose.py scripts/cronfig-dump.py
          [[ "$RELEASE" =~ ^[a-z0-9-]{1,40}$ ]]
          case "$ACTION" in stage|activate|verify|maintenance|renew-certificate) ;; *) exit 1 ;; esac
      - name: Configure pinned SSH host
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          echo '165.232.83.73 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIGaRm7II3PTOL5ncrjYgZ6ZhRvuJ6lolt/CwXX/bRbQh' > ~/.ssh/known_hosts
          printf 'Host *\n  User root\n  IdentityFile ~/.ssh/id_ed25519\n  IdentitiesOnly yes\n  StrictHostKeyChecking yes\n  BatchMode yes\n  ConnectTimeout 15\n  ServerAliveInterval 15\n  ServerAliveCountMax 3\n' > ~/.ssh/config
      - name: Stage deployment code
        run: |
          code="/root/cronfig-code-$GITHUB_SHA"
          ssh "$DEPLOY_HOST" "umask 077; mkdir -p '$code'"
          tar -czf "$RUNNER_TEMP/code.tar.gz" scripts deployment instances
          scp "$RUNNER_TEMP/code.tar.gz" "$DEPLOY_HOST:$code/code.tar.gz"
          ssh "$DEPLOY_HOST" "tar -xzf '$code/code.tar.gz' -C '$code'"
      - name: Issue certificate on DigitalOcean without transferring its private key
        if: inputs.cronfig_action == 'stage'
        env:
          DIGITALOCEAN_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
        run: python3 scripts/cronfig-certificate.py
      - name: Deploy only the selected Cronfig phase
        run: |
          code="/root/cronfig-code-$GITHUB_SHA"
          if ! ssh "$DEPLOY_HOST" "python3 '$code/scripts/cronfig-deploy.py' '$ACTION' '$RELEASE' > '$code/$ACTION.log' 2>&1"; then
            echo 'Cronfig phase failed. Private diagnostics remain on DigitalOcean; traffic was not automatically redirected.'
            exit 1
          fi
          echo "Cronfig $ACTION completed." >> "$GITHUB_STEP_SUMMARY"
      - name: Move only the m.cronfig.io DNS record after activation
        if: inputs.cronfig_action == 'activate'
        env:
          DIGITALOCEAN_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
        run: python3 scripts/cronfig-dns.py

  chimpino:
    if: github.ref == 'refs/heads/veetr-v2' && inputs.instance == 'chimpino'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DEPLOY_HOST: 165.232.83.73
      RELEASE: ${{ inputs.release }}
      ACTION: ${{ inputs.cronfig_action }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Validate deployment code
        run: |
          python3 -m unittest discover -s tests
          python3 -m py_compile scripts/chimpino-deploy.py scripts/chimpino-compose.py scripts/chimpino-dump.py
          [[ "$RELEASE" =~ ^[a-z0-9-]{1,40}$ ]]
          case "$ACTION" in stage|activate|verify|maintenance|renew-certificate) ;; *) exit 1 ;; esac
      - name: Configure pinned SSH host
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          echo '165.232.83.73 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIGaRm7II3PTOL5ncrjYgZ6ZhRvuJ6lolt/CwXX/bRbQh' > ~/.ssh/known_hosts
          printf 'Host *\n  User root\n  IdentityFile ~/.ssh/id_ed25519\n  IdentitiesOnly yes\n  StrictHostKeyChecking yes\n  BatchMode yes\n  ConnectTimeout 15\n  ServerAliveInterval 15\n  ServerAliveCountMax 3\n' > ~/.ssh/config
      - name: Stage deployment code
        run: |
          code="/root/chimpino-code-$GITHUB_SHA"
          ssh "$DEPLOY_HOST" "umask 077; mkdir -p '$code'"
          tar -czf "$RUNNER_TEMP/code.tar.gz" scripts deployment instances
          scp "$RUNNER_TEMP/code.tar.gz" "$DEPLOY_HOST:$code/code.tar.gz"
          ssh "$DEPLOY_HOST" "tar -xzf '$code/code.tar.gz' -C '$code'"
      - name: Require the certificate issued through authoritative GoDaddy DNS
        if: inputs.cronfig_action == 'stage'
        run: ssh "$DEPLOY_HOST" 'test -s /etc/letsencrypt/live/m.chimpino.com/fullchain.pem'
      - name: Deploy only the selected Chimpino phase
        run: |
          code="/root/chimpino-code-$GITHUB_SHA"
          if ! ssh "$DEPLOY_HOST" "python3 '$code/scripts/chimpino-deploy.py' '$ACTION' '$RELEASE' > '$code/$ACTION.log' 2>&1"; then
            echo 'Chimpino phase failed. Private diagnostics remain on DigitalOcean; traffic was not automatically redirected.'
            exit 1
          fi
          echo "Chimpino $ACTION completed." >> "$GITHUB_STEP_SUMMARY"
      - name: Record pending authoritative DNS cutover
        if: inputs.cronfig_action == 'activate'
        run: echo 'Chimpino application is ready. Update only the m.chimpino.com A record at GoDaddy after verification.' >> "$GITHUB_STEP_SUMMARY"
