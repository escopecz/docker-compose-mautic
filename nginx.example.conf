# Install on the host AFTER completing Mautic installation over an SSH tunnel.
# Replace the domain, certificate paths and loopback port for each instance.
# Obtain the certificate separately with your ACME client before enabling this file.
log_format mautic_without_query '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent';
server {
    listen 80;
    server_name marketing.example.com;
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    server_name marketing.example.com;
    ssl_certificate /etc/letsencrypt/live/marketing.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/marketing.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log /var/log/nginx/mautic-access.log mautic_without_query;
    client_max_body_size 25m;
    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Forwarded-Prefix "";
        proxy_set_header Forwarded "";
    }
}
